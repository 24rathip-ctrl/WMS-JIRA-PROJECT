name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package WAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Servlet API
        run: |
          curl -sSL -o javax.servlet-api-4.0.1.jar \
            https://repo1.maven.org/maven2/javax/servlet/javax.servlet-api/4.0.1/javax.servlet-api-4.0.1.jar
          if [ ! -s javax.servlet-api-4.0.1.jar ]; then
            echo "Failed to download javax.servlet-api-4.0.1.jar" >&2
            exit 1
          fi

      - name: Compile Java Sources
        run: |
          mkdir -p build/classes
          javac -cp "javax.servlet-api-4.0.1.jar:lib/mysql-connector-j-8.4.0.jar" \
            -d build/classes \
            $(find src -name "*.java")

      - name: Package WAR
        run: |
          mkdir -p build/staging
          cp -r web/* build/staging/
          
          # Exclude stale WEB-INF/classes, existing WEB-INF/lib, and all db.properties files
          rm -rf build/staging/WEB-INF/classes
          rm -rf build/staging/WEB-INF/lib
          find build/staging -name "*db.properties*" -delete

          # Assemble clean WEB-INF
          mkdir -p build/staging/WEB-INF/classes
          mkdir -p build/staging/WEB-INF/lib
          cp -r build/classes/* build/staging/WEB-INF/classes/
          cp lib/mysql-connector-j-8.4.0.jar build/staging/WEB-INF/lib/

          # Package wms.war
          jar -cvf wms.war -C build/staging .
          if [ ! -f wms.war ]; then
            echo "Packaging failed: wms.war not found" >&2
            exit 1
          fi

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wms-war
          path: wms.war
          if-no-files-found: error
